server {
    listen   80;
    server_name  application;

    access_log off;
    error_log /dev/stdout;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # this causes issues with Docker
    sendfile off;

    underscores_in_headers on;

    # Trust Caddy reverse-proxy and honor X-Forwarded-For so PHP sees the
    # real client IP via $_SERVER['REMOTE_ADDR']. Docker bridge networks use
    # private RFC1918 ranges; allow them all since the only thing reaching
    # this port is Caddy on the host.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  127.0.0.1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    location = favicon.ico { log_not_found off; access_log off; }
    location = robots.txt  { access_log off; log_not_found off; }

    # Serve the custom dark theme CSS (volume-mounted into /var/www/html/public)
    location = /dark.css {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Inject the dark theme stylesheet into every HTML response
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '</head>' '<link rel="stylesheet" href="/dark.css?v=1"></head>';

    # Socket.io / Laravel Echo Server
    location /socket.io {
        proxy_pass http://laravel-echo-server:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass            127.0.0.1:9000;
        fastcgi_index           index.php;
        include                 fastcgi_params;
        fastcgi_param           REQUEST_METHOD  $request_method;
        fastcgi_param           SCRIPT_FILENAME $document_root/$fastcgi_script_name;
        fastcgi_param           QUERY_STRING    $query_string;
        fastcgi_param           CONTENT_TYPE    $content_type;
        fastcgi_param           CONTENT_LENGTH  $content_length;
        fastcgi_param           HTTP_PROXY "";
   }

    location ~ /\.ht {
        deny all;
    }
}

source ~/.config/tmux/tmuxline.conf

#set -g default-terminal "screen-256color"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",tmux-256color:Ms=\\E]52;c%p1%.0s;%p2%s\\7"
set -ag terminal-overrides ",xterm-256color:Ms=\\E]52;c%p1%.0s;%p2%s\\7"
#set -as terminal-features ",xterm-256color:RGB"


set-environment -g FZF_TMUX 1

set -g mouse on

# osc 52 clipboard
set -g set-clipboard on
set -g allow-passthrough on
unbind -T copy-mode-vi Enter
unbind -n -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
# search up directly after /
bind-key / copy-mode \; send-key ?

set -g base-index 1
setw -g pane-base-index 1

# remap prefix to ^
unbind C-b
set -g prefix ^
bind ^ send-prefix

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf

# map Vi movement keys as pane movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes using PREFIX H, J, K, L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# use PREFIX | to split window horizontally and PREFIX - to split vertically
bind . split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# make the current window the first window
bind T swap-window -t 1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection_mouse 'clipboard'

# set -g @plugin 'Morantron/tmux-fingers'
#set -g @fingers-use-system-clipboard false
#set -g @fingers-key f
##set -g @finger-highlight-style "fg=white,bg=red"
##set -g @finger-backdrop-style "fg=gray,bg=black"

set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-bg-color "#444444"
set -g @thumbs-fg-color "#ffffff"
set -g @thumbs-hint-bg-color "#d7ff00"
set -g @thumbs-hint-fg-color "#1c1c1c"
set -g @thumbs-alphabet qwertz
set -g @thumbs-key " "
set -g @thumbs-osc52 1

## hex numbers/addresses
#set -g @thumbs-regexp-1 '0x[0-9a-fA-F]+'
#
## ctf flags
#set -g @thumbs-regexp-2 '[^\s]+\{[^{]*\}'
#
## hex strings
#set -g @thumbs-regexp-9 '[0-9a-fA-F]{8,}'
#
# ip v4
#set -g @thumbs-regexp-3 '(\b25[0-5]|\b2[0-4][0-9]|\b[01]?[0-9][0-9]?)(\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}'

# ip v6
#set -g @thumbs-regexp-4 '(([0-9a-fA-F]{1,4}:){7,7}[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,7}:|([0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,5}(:[0-9a-fA-F]{1,4}){1,2}|([0-9a-fA-F]{1,4}:){1,4}(:[0-9a-fA-F]{1,4}){1,3}|([0-9a-fA-F]{1,4}:){1,3}(:[0-9a-fA-F]{1,4}){1,4}|([0-9a-fA-F]{1,4}:){1,2}(:[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:((:[0-9a-fA-F]{1,4}){1,6})|:((:[0-9a-fA-F]{1,4}){1,7}|:)|fe80:(:[0-9a-fA-F]{0,4}){0,4}%[0-9a-zA-Z]{1,}|::(ffff(:0{1,4}){0,1}:){0,1}((25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])|([0-9a-fA-F]{1,4}:){1,4}:((25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9]))'

set -g @thumbs-reverse enabled
set -g @thumbs-unique enabled

run-shell '~/.config/tmux/plugins/tmux-thumbs/tmux-thumbs.tmux'

# set -g @plugin 'jhonrocha/tmux-copy-output'

# extrakto
set -g @plugin 'laktak/extrakto'
set -g @extrakto_grab_area 'window recent'
set -g @extracto_key 'x'
set -g @extrakto_fzf_tool 'fzf'
set -g @extrakto_split_size '13'
# run-shell ~/.config/tmux/plugins/extrakto/extrakto.tmux

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
run '~/.config/tmux/plugins/tpm/tpm'

